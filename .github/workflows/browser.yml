name: Browser sound check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install browser compiler
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Test native voice
        run: python3 tests/test_voice.py
      - name: Test memory timing and bounds
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Isrc src/voice.c src/keys.c src/drums.c src/sequencer.c src/harmony.c src/phrase.c src/groove.c src/bass_groove.c src/memory.c tests/test_memory.c -o /tmp/echolog-memory-test
          /tmp/echolog-memory-test
      - name: Build WebAssembly simulation
        run: |
          python3 tools/build_web.py
          python3 tools/build_standalone.py
      - name: Test compiled simulation
        run: |
          node tests/test_wasm.mjs
          node tests/test_worklet.mjs
          node tests/test_memory_wasm.mjs
      - name: Install browser test dependency
        run: npm ci
      - name: Test browser audio and controls
        run: |
          python3 -m http.server 8000 --directory build/web &
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome)"
          test -n "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH"
          node tests/test_browser.cjs
          TEST_URL="file://$PWD/preview/echolog-soundcheck.html" node tests/test_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: build/browser-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: echolog-browser-soundcheck
          path: build/web/
      - uses: actions/upload-artifact@v4
        with:
          name: vapor-loop-standalone-0.12.3
          path: preview/echolog-soundcheck.html
      - uses: actions/upload-artifact@v4
        with:
          name: first-sound-reference
          path: build/first-sound.wav





